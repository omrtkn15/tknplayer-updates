// Android TV hibrit WebView köprüsü. AndroidX WebMessageListener tarafında
// "nativeApp" adıyla ve yalnızca uygulama içi origin için tanımlanmalıdır.
let nativePlayerActive = false;
let nativePlaybackRequest = null;
function postNativePlayerMessage(type, payload = {}) {
  const bridge = window.nativeApp;
  if (!bridge || typeof bridge.postMessage !== 'function') return false;
  try {
    bridge.postMessage(JSON.stringify(Object.assign({ type }, payload)));
    return true;
  } catch (err) {
    console.warn('Android TV köprüsüne mesaj gönderilemedi:', err);
    return false;
  }
}
function stopNativePlayback() {
  if (!nativePlayerActive) return;
  postNativePlayerMessage('stop');
  nativePlayerActive = false;
}
window.dispatchAndroidTvKey = function(key, action = 'keydown') {
  const raw = String(key || '').trim();
  const upper = raw.toUpperCase();
  const aliases = {
    'DPAD_UP':'ArrowUp', 'KEYCODE_DPAD_UP':'ArrowUp', 'UP':'ArrowUp',
    'DPAD_DOWN':'ArrowDown', 'KEYCODE_DPAD_DOWN':'ArrowDown', 'DOWN':'ArrowDown',
    'DPAD_LEFT':'ArrowLeft', 'KEYCODE_DPAD_LEFT':'ArrowLeft', 'LEFT':'ArrowLeft',
    'DPAD_RIGHT':'ArrowRight', 'KEYCODE_DPAD_RIGHT':'ArrowRight', 'RIGHT':'ArrowRight',
    'DPAD_CENTER':'Enter', 'KEYCODE_DPAD_CENTER':'Enter', 'KEYCODE_ENTER':'Enter',
    'SELECT':'Select', 'KEYCODE_BACK':'Escape', 'BACK':'Escape', 'ESC':'Escape',
    'CHANNEL_UP':'ChannelUp', 'KEYCODE_CHANNEL_UP':'ChannelUp',
    'CHANNEL_DOWN':'ChannelDown', 'KEYCODE_CHANNEL_DOWN':'ChannelDown'
  };
  const keyName = aliases[upper] || raw;
  const keyCodeMap = {
    'ArrowUp':38, 'ArrowDown':40, 'ArrowLeft':37, 'ArrowRight':39,
    'Enter':13, 'Select':23, 'Escape':27, 'ChannelUp':166, 'ChannelDown':167
  };
  const code = keyCodeMap[keyName];
  if (!code) return false;
  const type = (action === 'keyup' || action === 'up') ? 'keyup' : 'keydown';
  window.dispatchEvent(new KeyboardEvent(type, {
    key:keyName, code:keyName, keyCode:code, which:code,
    bubbles:true, cancelable:true
  }));
  return true;
};
window.handleAndroidTvBack = function() {
  return window.dispatchAndroidTvKey('Escape', 'keydown');
};
window.onNativePlaybackEvent = function(rawEvent) {
  let event = rawEvent;
  if (typeof rawEvent === 'string') {
    try { event = JSON.parse(rawEvent); } catch (_) { event = { type:'error', message:'Geçersiz oynatıcı yanıtı' }; }
  }
  if (!event || typeof event !== 'object') return;
  const placeholder = document.getElementById('placeholder');
  if (event.type === 'accepted' || event.type === 'buffering') {
    nativePlayerActive = true;
    if (placeholder) { placeholder.textContent = 'Yayın yükleniyor…'; placeholder.style.display = 'flex'; }
    return;
  }
  if (event.type === 'playing') {
    nativePlayerActive = true;
    if (placeholder) placeholder.style.display = 'none';
    return;
  }
  if (event.type === 'stopped') {
    nativePlayerActive = false;
    if (placeholder) { placeholder.textContent = 'Yayın durduruldu'; placeholder.style.display = 'flex'; }
    return;
  }
  if (event.type === 'error' || event.type === 'unavailable') {
    const request = nativePlaybackRequest;
    nativePlayerActive = false;
    if (request && !request.forceWeb) {
      postNativePlayerMessage('stop');
      executeStreamPlay(request.url, request.title, request.fallback, request.num,
        request.group, request.programTitle, request.programDesc, true);
      return;
    }
    if (placeholder) {
      placeholder.textContent = String(event.message || 'Yayın açılamadı');
      placeholder.style.display = 'flex';
    }
  }
};

function epgTimestamp(value){
  if(value===undefined||value===null||value==='')return NaN;
  if(typeof value==='number'||/^\d{9,13}$/.test(String(value).trim())){
    let n=Number(value);if(n<1e12)n*=1000;return n/1000;
  }
  const parsed=Date.parse(String(value).trim().replace(' ','T'));
  return Number.isNaN(parsed)?NaN:parsed/1000;
}
function formatEpgClock(value){
  const stamp=epgTimestamp(value);if(!Number.isFinite(stamp))return '';
  return new Date(stamp*1000).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
function decodeEpgText(value){
  if(value===undefined||value===null)return '';
  let text=String(value).trim();
  // Bazı Xtream panelleri program başlığı/açıklamasını Base64 döndürüyor.
  if(text&&/^[A-Za-z0-9+/]+={0,2}$/.test(text)&&text.length%4===0){
    try{const decoded=decodeURIComponent(escape(atob(text)));if(decoded&&/[\p{L}\p{N}]/u.test(decoded))text=decoded}catch(e){}
  }
  return text;
}
function normalizeEpgEntry(entry){
  if(!entry)return null;
  const startRaw=entry.start_timestamp??entry.start??entry.start_time??entry.start_datetime;
  const endRaw=entry.stop_timestamp??entry.end_timestamp??entry.end??entry.stop??entry.end_time??entry.stop_datetime;
  return {
    start:epgTimestamp(startRaw),end:epgTimestamp(endRaw),
    title:decodeEpgText(entry.title||entry.name||entry.programme||entry.program_name||entry.epg_title||''),
    description:decodeEpgText(entry.description||entry.desc||entry.program_description||'')
  };
}
function channelEpgText(entry){
  const e=normalizeEpgEntry(entry);if(!e||!e.title)return '';
  const start=Number.isFinite(e.start)?formatEpgClock(e.start):'';
  const end=Number.isFinite(e.end)?formatEpgClock(e.end):'';
  return `${start&&end?`${start}–${end} · `:''}${e.title}`;
}
async function loadLiveEpg(item,channelName,channelNum,groupName){
  const token=(window.__liveEpgToken||0)+1;window.__liveEpgToken=token;
  const seed=decodeEpgText(item?.currentProgram||item?.epgTitle||item?.now_playing?.name||item?.epg_listings?.[0]?.title||'');
  showEpgOverlay(channelName,channelNum,groupName,seed||'EPG bilgisi alınıyor…','');
  if(!item||item.stream_id===undefined||item.stream_id===null){
    if(!seed)showEpgOverlay(channelName,channelNum,groupName,'Kanalın EPG kimliği bulunamadı','');
    return;
  }
  const parts=currentBaseUrl.split('player_api.php?');
  if(parts.length<2){if(!seed)showEpgOverlay(channelName,channelNum,groupName,'Xtream EPG için hesap bağlantısı gerekli','');return}
  const cacheKey=`${parts[0]}|${new URLSearchParams(parts[1]).get('username')}|${item.stream_id}`;
  const cached=channelEpgCache.get(cacheKey);
  if(cached&&Date.now()-cached.time<120000){
    showEpgOverlay(channelName,channelNum,groupName,cached.title||seed||'Güncel program bulunamadı',cached.description||'');return;
  }
  const baseParams=new URLSearchParams(parts[1]);
  const actions=[
    {action:'get_short_epg',limit:'10'},
    {action:'get_simple_data_table'}
  ];
  let entries=[];let lastError=null;
  for(const action of actions){
    const params=new URLSearchParams(baseParams);
    params.set('action',action.action);params.set('stream_id',String(item.stream_id));
    if(action.limit)params.set('limit',action.limit);
    try{
      const data=await fetchDataWithTimeout(`${parts[0]}player_api.php?${params.toString()}`,'json',8000);
      if(token!==window.__liveEpgToken)return;
      const found=Array.isArray(data)?data:(Array.isArray(data?.epg_list)?data.epg_list:Array.isArray(data?.epg_listings)?data.epg_listings:[]);
      if(found.length){entries=found;break}
    }catch(e){lastError=e}
  }
  if(token!==window.__liveEpgToken)return;
  const now=Date.now()/1000;
  const normalized=entries.map(normalizeEpgEntry).filter(e=>e&&e.title);
  const current=normalized.find(e=>Number.isFinite(e.start)&&Number.isFinite(e.end)&&e.start<=now&&e.end>=now)
    ||normalized.filter(e=>Number.isFinite(e.start)&&e.start>now).sort((a,b)=>a.start-b.start)[0]
    ||normalized[0];
  const title=current?.title||seed;
  const description=current?.description||'';
  channelEpgCache.set(cacheKey,{time:Date.now(),title,description});
  if(title)showEpgOverlay(channelName,channelNum,groupName,title,description);
  else showEpgOverlay(channelName,channelNum,groupName,lastError?'EPG sunucusuna ulaşılamadı':'Bu kanal için EPG programı bulunamadı','');
}

function parseBuiltInM3U(){
  const lines=rawM3U.split('\n');
  let cur={},catCounts={};
  builtInChannels=[];
  for(let i=0;i<lines.length;i++){
    let line=lines[i].trim();
    if(line.startsWith('#EXTINF:')){
      cur={};
      const l=line.match(/tvg-logo="([^"]*)"/);cur.logo=l?l[1]:'';
      const g=line.match(/group-title="([^"]*)"/);cur.group=g?g[1]:'DİĞER';
      const np=line.split(',');cur.name=np[np.length-1].trim();
    } else if(line && !line.startsWith('#')){
      cur.url=line;
      if(cur.name&&cur.url){builtInChannels.push(cur);catCounts[cur.group]=(catCounts[cur.group]||0)+1}
      cur={};
    }
  }
  builtInCategories=['TÜMÜ',...Object.keys(catCounts)];
  builtInBaseChannels=builtInChannels.slice();
  updateAddedChannelCategoryOptions();
}

function getDeletedBuiltInChannelUrls(){try{return new Set(JSON.parse(localStorage.getItem('tkn_deleted_builtin_channels')||'[]'))}catch(e){return new Set()}}
function refreshBuiltInChannelGroups(){
  const del=getDeletedBuiltInChannelUrls();
  const playlistUrls=new Set((Array.isArray(savedPlaylists)?savedPlaylists:[]).map(p=>String(p?.url||'').trim().toLowerCase()).filter(Boolean));
  const baseUniq=new Map();
  builtInBaseChannels.forEach(c=>{const k=String(c.url||'').trim().toLowerCase();if(k&&!isThemeAssetUrl(c.url)&&!del.has(String(c.url||'').trim())&&!baseUniq.has(k))baseUniq.set(k,c)});
  const base=Array.from(baseUniq.values());
  let user=[];try{user=JSON.parse(localStorage.getItem('tkn_user_added_builtin_channels')||'[]')}catch(e){}
  if(!Array.isArray(user))user=[];
  user=user.filter(c=>c&&typeof c==='object'&&String(c.name||'').trim()&&/^https?:\/\//i.test(String(c.url||'').trim())&&!isThemeAssetUrl(c.url)&&!playlistUrls.has(String(c.url||'').trim().toLowerCase())).map(c=>({...c,name:String(c.name).trim(),url:String(c.url).trim(),group:String(c.group||'').trim()||'DİĞER'}));
  try{localStorage.setItem('tkn_user_added_builtin_channels',JSON.stringify(user))}catch(e){}
  const baseUrls=new Set(builtInBaseChannels.filter(c=>!isThemeAssetUrl(c.url)).map(c=>String(c.url||'').trim().toLowerCase()));
  const allowedGroups=[...new Set([...builtInBaseChannels.map(c=>c.group||'DİĞER'),...user.map(c=>c&&c.group||'DİĞER')])];
  const fallback=allowedGroups[0]||'DİĞER';
  const addedUniq=new Map();
  user.forEach(c=>{
    const uk=String(c.url||'').trim(),k=uk.toLowerCase();
    const cat=allowedGroups.includes(c.group)?c:{...c,group:fallback};
    if(k&&!baseUrls.has(k)&&!del.has(uk)&&!addedUniq.has(k))addedUniq.set(k,cat);
  });
  addedManagedChannels=Array.from(addedUniq.values());
  builtInChannels=[...base,...addedManagedChannels];
  const groups=[...new Set(builtInChannels.map(c=>c.group||'DİĞER'))];
  builtInCategories=['TÜMÜ',...groups];
}

function updateAddedChannelCategoryOptions(){
  const s=document.getElementById('addedChannelCategorySelect');if(!s)return;
  const prev=s.value;
  let saved=[];try{saved=JSON.parse(localStorage.getItem('tkn_user_added_builtin_channels')||'[]')}catch(e){}
  const cats=[...new Set([...builtInBaseChannels.map(c=>c.group||'DİĞER'),...(Array.isArray(saved)?saved.map(c=>c&&c.group||'DİĞER'):[])])];
  s.innerHTML='';
  if(!cats.length){const o=document.createElement('option');o.value='DİĞER';o.textContent='DİĞER';s.appendChild(o);return}
  cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;s.appendChild(o)});
  if(cats.includes(prev))s.value=prev;
}

function deleteCloudAddedChannels(){
  let stored=[];try{stored=JSON.parse(localStorage.getItem('tkn_user_added_builtin_channels')||'[]')}catch(e){}
  if(!Array.isArray(stored))stored=[];
  let cloudKeys=[];try{cloudKeys=JSON.parse(localStorage.getItem('tkn_cloud_channel_urls')||'[]')}catch(e){}
  const cloudSet=new Set((Array.isArray(cloudKeys)?cloudKeys:[]).map(u=>String(u||'').trim().toLowerCase()));
  const targets=stored.filter(c=>c&&c.url&&(c.source==='cloud'||/bulut|cloud/i.test(String(c.group||''))||cloudSet.has(String(c.url).trim().toLowerCase())));
  if(!targets.length){alert('Buluttan eklenmiş kayıtlı kanal bulunamadı. Önce bir kez Bulut’tan Yenile yapın.');return;}
  if(!confirm(`${targets.length} buluttan eklenmiş kanal kaldırılacak. Bir sonraki bulut yenilemesinde de geri gelmeyecek. Devam edilsin mi?`))return;
  // Buluttan kaldırma yalnızca cihazdaki kopyayı siler. Kalıcı silme işareti
  // bırakılmaz; kullanıcı aynı kanalları buluttan tekrar yükleyebilmelidir.
  const targetSet=new Set(targets.map(c=>String(c.url).trim().toLowerCase()));
  const deleted=getDeletedBuiltInChannelUrls();
  // Eski sürümlerde URL'ler farklı harf biçimiyle kaydedilmiş olabilir.
  // Karşılaştırmayı normalize ederek tüm eski engel kayıtlarını kaldır.
  for(const oldUrl of Array.from(deleted)){
    if(targetSet.has(String(oldUrl||'').trim().toLowerCase()))deleted.delete(oldUrl);

function parseUserBuiltInChannels(text,fileName=''){
  const s=String(text||'').replace(/^\uFEFF/,'');
  const ch=[];
  const fileCategory=String(fileName||'HTML DOSYASINDAN').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim()||'HTML DOSYASINDAN';

  if(/\.m3u8?$/i.test(fileName)||/#EXTINF:/i.test(s)){
    let cur=null;
    s.split(/\r?\n/).forEach(line=>{
      line=line.trim();
      if(line.startsWith('#EXTINF:')){
        const l=line.match(/tvg-logo="([^"]*)"/i),g=line.match(/group-title="([^"]*)"/i),id=line.match(/tvg-id="([^"]*)"/i);
        cur={name:line.slice(line.lastIndexOf(',')+1).trim(),logo:l?l[1]:'',group:g?g[1]:'USB / ELLE EKLENEN',tvgId:id? id[1]:''};
      }else if(line&&!line.startsWith('#')&&cur&&cur.name){ch.push({...cur,url:line});cur=null}
    });
    if(ch.length)return ch;
  }

  // JavaScript içinde tanımlanmış kanal dizilerini (name + id) ve BASE_URL yapısını oku.
  // Örnek: const channels=[{name:"KANAL",id:"kanal1"}];
  if(/\.html?$/i.test(fileName)||/<(?:html|a|video|source)\b/i.test(s)){
    try{
      const baseMatch=s.match(/(?:const|let|var)\s+BASE_URL\s*=\s*(['"])(https?:\/\/[^'"]+)\1/i);
      const routeMatch=s.match(/(?:mainPlayer|player|video)\.src\s*=\s*BASE_URL\s*\+\s*(['"])([^'"]+)\1\s*\+\s*(?:channel|ch)\.id/i);
      const arrayMatch=s.match(/(?:const|let|var)\s+channels\s*=\s*\[([\s\S]*?)\]\s*;/i);
      if(baseMatch&&arrayMatch){
        const base=baseMatch[2].replace(/\/?$/,'/');
        const route=routeMatch?routeMatch[2]:'channel?id=';
        const objectMatches=arrayMatch[1].match(/\{[^{}]*\}/g)||[];
        objectMatches.forEach(obj=>{
          const nm=obj.match(/\bname\s*:\s*(['"])(.*?)\1/i);
          const id=obj.match(/\bid\s*:\s*(['"])(.*?)\1/i);
          if(!nm||!id)return;
          const url=base+route+encodeURIComponent(id[2]);
          if(!ch.some(x=>x.url.toLowerCase()===url.toLowerCase())){
            ch.push({name:nm[2].trim(),url,logo:'',group:fileCategory,sourceId:id[2]});
          }
        });
        if(ch.length)return ch;
      }

      const doc=new DOMParser().parseFromString(s,'text/html');
      const nodes=Array.from(doc.querySelectorAll('a[href],video[src],source[src],[data-url],[data-src],[data-stream],[data-hls]'));
      nodes.forEach(node=>{
        const raw=node.getAttribute('href')||node.getAttribute('src')||node.getAttribute('data-url')||node.getAttribute('data-src')||node.getAttribute('data-stream')||node.getAttribute('data-hls')||'';
        let url=raw.trim();try{url=new URL(url,location.href).href}catch(e){}
        const isEmbeddedChannelPage=node.matches('a.single-match, a[data-matchtype], a[target="macth-video"], a[target="match-video"]');
        if(!/^https?:\/\//i.test(url)||!(/\.(m3u8?|m3u|ts|m2ts|mp4|mpd|mp3)(?:$|[?#])/i.test(url)||node.matches('video,source')||node.hasAttribute('data-url')||node.hasAttribute('data-src')||node.hasAttribute('data-stream')||node.hasAttribute('data-hls')||isEmbeddedChannelPage))return;
        const container=node.closest('[data-name],[data-channel],.channel,.item,.card,tr,li')||node;
        let name=(node.getAttribute('data-name')||node.getAttribute('aria-label')||node.getAttribute('title')||container.getAttribute?.('data-name')||node.textContent||container.textContent||'').replace(/\s+/g,' ').trim();
        name=name.replace(url,'').trim();
        if(!name||/^https?:\/\//i.test(name)){
          try{name=decodeURIComponent(new URL(url).pathname.split('/').filter(Boolean).pop()||new URL(url).hostname).replace(/\.(m3u8?|m3u|ts|m2ts|mp4|mpd|mp3)$/i,'')}catch(e){name='Kanal'}
        }
        if(!ch.some(x=>x.url.toLowerCase()===url.toLowerCase()))ch.push({name,url,logo:node.getAttribute('data-logo')||'',group:fileCategory,page:isEmbeddedChannelPage});
      });

      // JavaScript/JSON içine gömülü doğrudan yayın URL'lerini de tara.
      const urlRegex=/https?:\/\/[^\s"'<>\\]+/gi;
      let match;
      while((match=urlRegex.exec(s))!==null){
        const url=match[0].replace(/[),;]+$/,'');
        if(!/\.(m3u8?|m3u|ts|m2ts|mp4|mpd)(?:$|[?#])/i.test(url)&&!/(\/live\/|\/stream\/|\/play\/|\/playlist\/|\/hls\/|\/manifest)/i.test(url))continue;
        if(/\.(png|jpe?g|gif|webp|svg)(?:$|[?#])/i.test(url))continue;
        if(ch.some(x=>x.url.toLowerCase()===url.toLowerCase()))continue;
        const before=s.slice(Math.max(0,match.index-180),match.index);
        const nameMatch=before.match(/(?:name|title|channelName)\s*[:=]\s*['"]([^'"]+)['"]\s*[,;]?\s*$/i);
        ch.push({name:nameMatch?nameMatch[1].trim():'Kanal '+(ch.length+1),url,logo:'',group:fileCategory});
      }
    }catch(e){console.warn('HTML kanal listesi okunamadı:',e)}
    if(ch.length)return ch;
  }

  const lines=s.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
  for(let i=0;i<lines.length;i++){
    const first=lines[i];
    if(first.includes('|')){
      const[n,u]=first.split('|',2).map(v=>v.trim());if(n&&/^https?:\/\//i.test(u))ch.push({name:n,url:u,group:''});
    }else if(/^https?:\/\//i.test(first)){
      const prior=lines[i-1];const name=prior&&!/^https?:\/\//i.test(prior)?prior:'Kanal '+(ch.length+1);
      ch.push({name,url:first,group:''});
    }else if(lines[i+1]&&/^https?:\/\//i.test(lines[i+1])){
      ch.push({name:first,url:lines[i+1],group:''});i++;
    }
  }
  return ch;
}
function saveUserBuiltInChannels(channels){
  const target=getAddedChannelCategory();
  const valid=channels.filter(c=>c&&String(c.name||'').trim()&&/^https?:\/\//i.test(String(c.url||'').trim())&&!isThemeAssetUrl(c.url)).map(c=>({...c,name:String(c.name).trim(),url:String(c.url).trim(),group:String(c.group||'').trim()||target}));
  if(!valid.length){alert('Geçerli kanal bulunamadı.');return 0}
  let saved=[];try{saved=JSON.parse(localStorage.getItem('tkn_user_added_builtin_channels')||'[]')}catch(e){}
  if(!Array.isArray(saved))saved=[];
  const ex=new Set([...builtInBaseChannels,...importedPlaylistChannels,...saved].map(c=>String(c.url||'').trim().toLowerCase()));
  const added=valid.filter(c=>!ex.has(c.url.toLowerCase()));
  try{localStorage.setItem('tkn_user_added_builtin_channels',JSON.stringify([...saved,...added]));}
  catch(e){console.error('Yerel kanal kaydı başarısız:',e);alert('Kanallar okunabildi ancak cihaz hafızasına kaydedilemedi. Depolama alanını kontrol edin.');return 0}
  refreshBuiltInChannelGroups();renderBuiltInPlaylistManager();
  if(isBuiltInMode){renderBuiltInCategories(builtInCategories);filterBuiltInChannelsByCategory(activeBuiltInCategory);const badge=document.getElementById('badgePlaylistName');if(badge)badge.innerText=`IPTV: Yüklü Kanallar (${builtInChannels.length})`}
  alert(added.length?`${added.length} kanal cihaz hafızasına eklendi.`:'Bu kanallar zaten kayıtlı.');
  return added.length;
}

function handleBuiltInChannelsFile(event){
  const input=event&&event.target;
  const f=input&&input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const channels=parseUserBuiltInChannels(r.result,f.name);
      if(!channels.length){alert('Dosyada kanal bağlantısı bulunamadı. M3U/TXT veya içinde yayın bağlantıları olan HTML dosyası seçin.');return;}
      saveUserBuiltInChannels(channels);
    }catch(err){console.error('İçe aktarma hatası:',err);alert('Dosya içe aktarılamadı: '+(err.message||err));}
    finally{if(input)input.value='';}
  };
  r.onerror=()=>{alert('Dosya okunamadı.');if(input)input.value='';};
  r.readAsText(f,'UTF-8');
}

function enterLandscapeFullscreen(video){
  const lock=()=>{try{if(screen.orientation&&typeof screen.orientation.lock==='function'){const r=screen.orientation.lock('landscape');if(r&&r.catch)r.catch(()=>{})}}catch(e){}};
  try{
    const box=document.getElementById('playerContainer');
    if(document.fullscreenElement||document.webkitFullscreenElement){lock();return}
    if(box)box.classList.remove('mobile-fullscreen-mode');
    const target=box||video;
    const req=target.requestFullscreen||target.webkitRequestFullscreen;
    if(req){const r=req.call(target);if(r&&r.then)r.then(lock).catch(lock);else lock()}
    else if(video.webkitEnterFullscreen){video.webkitEnterFullscreen();lock()}
  }catch(e){lock()}
}

function getCorsProxyUrl(url){
  if(!url) return '';
  if(url.includes('corsproxy.io') || url.includes('allorigins.win')) return url;
  return `https://corsproxy.io/?${encodeURIComponent(url)}`;
}

    if(!fallback||fbTried||fallback===url)return false;
    fbTried=true;if(hlsInstance){try{hlsInstance.destroy()}catch(e){}hlsInstance=null}if(mpegtsInstance){try{mpegtsInstance.destroy()}catch(e){}mpegtsInstance=null}
    executeStreamPlay(fallback,title,'',num,group,programTitle,programDesc,forceWeb);return true;
  };
  const fail=()=>{if(token!==playbackRequestToken)return;if(!tryFb())showStreamFailure('Yayın bulunamadı',token)};
  if(hlsInstance){try{hlsInstance.destroy()}catch(e){}hlsInstance=null}
  if(mpegtsInstance){try{mpegtsInstance.destroy()}catch(e){}mpegtsInstance=null}
  v.onerror=null;v.pause();v.removeAttribute('src');try{v.load()}catch(e){}
  if(!url){showStreamFailure('Yayın adresi bulunamadı',token);return}
  nativePlaybackRequest={url,title,fallback,num,group,programTitle,programDesc,forceWeb};
  if(!forceWeb && postNativePlayerMessage('playLive',{url:String(url),title:String(title||'Canlı yayın'),group:String(group||'Genel')})){
    nativePlayerActive=true;
    v.style.display='none';
    if(p){p.textContent='Android TV oynatıcısında açılıyor…';p.style.display='flex'}
    return;
  }
  nativePlayerActive=false;
  v.style.display='block';
  v.onplaying=()=>{if(token!==playbackRequestToken)return;v.volume=1;v.muted=false;if(playbackWatchdog){clearTimeout(playbackWatchdog);playbackWatchdog=null}if(playbackStallTimer){clearTimeout(playbackStallTimer);playbackStallTimer=null}v.muted=false;if(p)p.style.display='none'};
  v.onwaiting=()=>{
    if(token!==playbackRequestToken||v.paused)return;
    if(playbackStallTimer)clearTimeout(playbackStallTimer);
    playbackStallTimer=setTimeout(()=>{
      if(token!==playbackRequestToken||v.paused)return;
      if(hlsInstance){try{hlsInstance.startLoad()}catch(e){}}
      else{try{const r=v.play();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
    },5000);
  };
  v.onstalled=()=>{if(token!==playbackRequestToken||v.paused)return;if(playbackStallTimer)clearTimeout(playbackStallTimer);playbackStallTimer=setTimeout(()=>{if(token===playbackRequestToken&&!v.paused&&hlsInstance){try{hlsInstance.startLoad()}catch(e){}}},6000)};
  v.onerror=()=>{if(token===playbackRequestToken)fail()};
  // Kanal geçişinde uzun süre siyah ekran beklememek için daha kısa watchdog.
  playbackWatchdog=setTimeout(fail,10000);

  const pathOnly=String(url).split('?')[0].split('#')[0].toLowerCase();
  const isHls=/\.(m3u8?|m3u)$/.test(pathOnly);
  const isMpegTs=/\.(ts|m2ts)$/.test(pathOnly);
  const isDirectVideoFile=/\.(mp4|m4v|mov|webm|mkv|avi|ogv|mp3|aac|m4a|mpg|mpeg)$/.test(pathOnly);
  const nativeHls=isHls&&!!v.canPlayType('application/vnd.apple.mpegurl');
  const hlsSupported=typeof Hls!=='undefined'&&Hls.isSupported();
  const playNative=()=>{
    v.src=url;
    const pr=v.play();if(pr&&pr.catch)pr.catch(err=>{console.warn('Video oynatma başlatılamadı:',err);fail()});
  };
  if(isHls&&nativeHls){
    playNative();
  }else if(isMpegTs&&typeof mpegts!=='undefined'&&mpegts.isSupported()){
    try{
      mpegtsInstance=mpegts.createPlayer({type:'mpegts',isLive:true,url},{enableWorker:true,enableStashBuffer:false,liveBufferLatencyChasing:true,liveBufferLatencyMaxLatency:8,liveBufferLatencyMinRemain:2});
      const tsPlayer=mpegtsInstance;
      tsPlayer.attachMediaElement(v);tsPlayer.on(mpegts.Events.ERROR,()=>{if(token===playbackRequestToken)fail()});
      tsPlayer.load();const playResult=tsPlayer.play();if(playResult&&playResult.catch)playResult.catch(()=>fail());
    }catch(err){console.warn('MPEG-TS oynatıcı başlatılamadı:',err);if(!tryFb())playNative()}
  }else if(!isMpegTs&&!isDirectVideoFile&&hlsSupported){
    hlsInstance=new Hls({
      capLevelToPlayerSize: false,
      // Daha geniş tampon: kısa internet dalgalanmalarında takılmayı azaltır.
      maxBufferLength: 8,
      maxMaxBufferLength: 20,
      maxBufferSize: 20 * 1024 * 1024,
      liveSyncDurationCount: 2,
      liveMaxLatencyDurationCount: 5,
      maxBufferHole: 0.5,
      nudgeOffset: 0.1,
      nudgeMaxRetry: 5,
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 0,
      startFragPrefetch: true,
      fragLoadingTimeOut: 20000,
      manifestLoadingTimeOut: 15000,
      levelLoadingTimeOut: 15000,
      startLevel: -1,
      xhrSetup:function(xhr){xhr.withCredentials=false}
    });
    const currentHls=hlsInstance;
    currentHls.loadSource(url);currentHls.attachMedia(v);
    currentHls.on(Hls.Events.MANIFEST_PARSED,()=>{if(token!==playbackRequestToken)return;v.play().catch(()=>{v.muted=true;v.play().catch(fail)})});
    currentHls.on(Hls.Events.ERROR,(_,data)=>{
      if(token!==playbackRequestToken||!data.fatal)return;
      if(data.type===Hls.ErrorTypes.NETWORK_ERROR){if(!tryFb())currentHls.startLoad()}
      else if(data.type===Hls.ErrorTypes.MEDIA_ERROR)currentHls.recoverMediaError();
      else if(!tryFb())showStreamFailure('Yayın bulunamadı',token);
    });
  }else playNative();
}

function enterMobileFullscreen(){
  const box=document.getElementById('playerContainer');
  if(!box)return;
  if(document.fullscreenElement||document.webkitFullscreenElement){
    const current=document.fullscreenElement||document.webkitFullscreenElement;
    if(current===box||current===document.getElementById('videoPlayer')){
      box.classList.add('mobile-fullscreen-mode');
      resetMobileControlsTimer();
      setTimeout(()=>focusRemoteElement(document.querySelector('#mobileFullscreenControls button')),50);
      return;
    }
    const exit=document.exitFullscreen||document.webkitExitFullscreen;
    if(exit){const result=exit.call(document);if(result&&result.then){result.then(()=>enterMobileFullscreen()).catch(()=>{})}return}
  }
  box.classList.add('mobile-fullscreen-mode');
  resetMobileControlsTimer();
  const req=box.requestFullscreen||box.webkitRequestFullscreen;
  if(req){const r=req.call(box);if(r&&r.then)r.then(()=>setTimeout(()=>focusRemoteElement(document.querySelector('#mobileFullscreenControls button')),50)).catch(()=>box.classList.remove('mobile-fullscreen-mode'))}
  try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
}

function mobileBackButton(event){

  const video=document.getElementById('videoPlayer');

    const exit=document.exitFullscreen||document.webkitExitFullscreen;

function exitMobileFullscreen(event){
  if(event){event.preventDefault();event.stopPropagation()}
  const box=document.getElementById('playerContainer');
  const video=document.getElementById('videoPlayer');
  if(mobileControlsTimeout) clearTimeout(mobileControlsTimeout);
  const active=!!(document.fullscreenElement||document.webkitFullscreenElement||(box&&box.classList.contains('mobile-fullscreen-mode')));
  if(!active){goBackFromPlayer();return}
  const exit=document.exitFullscreen||document.webkitExitFullscreen;
  try{
    if(exit){const result=exit.call(document);if(result&&result.catch)result.catch(()=>{})}
    else if(video&&typeof video.webkitExitFullscreen==='function')video.webkitExitFullscreen();
  }catch(e){}
  if(box)box.classList.remove('mobile-fullscreen-mode');
  try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch(e){}
}

  closeMobileMenu();
  document.querySelectorAll('.page-view').forEach(p=>p.classList.remove('active'));

    else if(page==='series'){activeTab='series';document.getElementById('menuSeries').classList.add('active');if(t)t.innerText='Diziler'}

function checkAllPlaylistsExpiry(){
  if(playlistAuditRunning||!savedPlaylists.length)return;
  playlistAuditRunning=true;
  savedPlaylists.forEach(it=>{if(!it.status||it.status==='Aktif')it.status='Kontrol ediliyor'});
  updateGlobalCounts();
  const list=savedPlaylists.map((it,idx)=>({url:it.url,index:idx}));
  let cur=0;
  const worker=async()=>{
    while(cur<list.length){
      const c=list[cur++];
      const r=await new Promise(res=>fetchPlaylistExpiry(c.url,(exp,act,info={})=>res({exp,act,...info})));
      const it=savedPlaylists[c.index];if(!it||it.url!==c.url)continue;
      it.expiry=r.exp;it.status=r.act===true?'Aktif':r.act===false?'Pasif':'Kontrol edilemedi';
      it.maxConnections=r.maxConnections??null;it.activeConnections=r.activeConnections??null;
      const e=document.getElementById(`playlistExpiry_${c.index}`);if(e)e.innerText=r.exp;
      const co=document.getElementById(`playlistConnections_${c.index}`);if(co)co.textContent=`Hesap limiti: ${it.maxConnections??'Bilinmiyor'} · İzleyen: ${it.activeConnections??'Bilinmiyor'}`;
      const s=document.getElementById(`playlistStatus_${c.index}`);if(s){s.innerText=it.status;s.style.background=r.act===true?'#059669':r.act===false?'#dc2626':'#b7791f'}
      localStorage.setItem('tkn_saved_playlists',JSON.stringify(savedPlaylists));
      updateGlobalCounts();
    }
  };
  Promise.all(Array.from({length:Math.min(5,list.length)},()=>worker())).finally(()=>{playlistAuditRunning=false;updateGlobalCounts()});
}

function fetchDataWithTimeout(url,type='json',timeout=10000){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),timeout);
  return fetch(url,{cache:'no-store',signal:c.signal}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return type==='json'?r.json():r.text()}).finally(()=>clearTimeout(t));
}

function fetchPlaylistExpiry(url,callback){
  let done=false;
  const safe=(...args)=>{if(!done){done=true;callback(...args)}};
  let u;try{u=new URL(url)}catch(e){safe('Hatalı URL',false);return}
  const q=u.searchParams;
  const isXt=/(get|player_api)\.php$/i.test(u.pathname)&&q.has('username')&&q.has('password');
  if(isXt){
    u.pathname=u.pathname.replace(/(?:get|player_api)\.php$/i,'player_api.php');
    fetchDataWithTimeout(u.toString(),'json').then(d=>{
      if(!d||!d.user_info){safe('Hesap bilgisi yok',null);return}
      const exp=d.user_info.exp_date;const st=String(d.user_info.status||'').toLowerCase();
      let act=!['disabled','banned','expired'].includes(st);
      let e='Sınırsız';
      if(exp!==null&&exp!==undefined&&exp!==''&&exp!=='null'&&Number(exp)>0){
        const ms=Number(exp)*1000,dt=new Date(ms);
        if(!Number.isNaN(dt.getTime()))e=dt.toLocaleDateString('tr-TR');
        if(ms<Date.now())act=false;
      }
      safe(e,act,{maxConnections:d.user_info.max_connections??null,activeConnections:d.user_info.active_cons??null});
    }).catch(err=>safe(err.name==='AbortError'?'Zaman aşımı':'Kontrol edilemedi',null));
    return;
  }
  fetchDataWithTimeout(url,'text').then(text=>{
    const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    const hh=lines.some(l=>l.startsWith('#EXTM3U'));
    const ec=lines.filter(l=>l.startsWith('#EXTINF:')).length;
    const sc=lines.filter(l=>/^(https?|rtmp|rtsp):\/\//i.test(l)&&!l.startsWith('#')).length;
    const act=hh&&ec>0&&sc>0;
    safe(act?`M3U · ${ec} kayıt`:'Geçersiz M3U',act);
  }).catch(err=>safe(err.name==='AbortError'?'Zaman aşımı':'Kontrol edilemedi',null));
}

function loadRemoteM3UPlaylist(url,name,navigate=true,cb=null){
  const finish=()=>{if(cb)cb()};
  const consume=text=>{
    const channels=parseUserBuiltInChannels(text,name||'UZAK M3U');
    if(!channels.length)throw new Error('M3U kanal kaydı bulunamadı');
    let saved=[];try{saved=JSON.parse(localStorage.getItem('tkn_user_added_builtin_channels')||'[]')}catch(e){}
    if(!Array.isArray(saved))saved=[];
    const known=new Set([...builtInBaseChannels,...saved].map(c=>String(c.url||'').toLowerCase()));
    const fresh=channels.filter(c=>!known.has(String(c.url||'').toLowerCase()));
    localStorage.setItem('tkn_user_added_builtin_channels',JSON.stringify([...saved,...fresh]));
    refreshBuiltInChannelGroups();
    importedPlaylistSource=url;
    isBuiltInMode=true;isPlaylistWorking=true;
    currentBaseUrl=url;
    document.getElementById('badgePlaylistName').innerText=`M3U: ${name||'Uzak Liste'} (${builtInChannels.length})`;
    document.getElementById('badgeExpiryDate').innerText='Bitiş: Sınırsız';
    if(navigate)loadBuiltInChannelsView();
    finish();
  };
  fetchDataWithTimeout(url,'text',20000).then(consume).catch(()=>{
    fetchDataWithTimeout(getCorsProxyUrl(url),'text',25000).then(consume).catch(err=>{
      alert('M3U indirilemedi. Sunucu CORS erişimini engelliyor veya liste geçersiz.');
      finish();
    });
  });
}

function parseAndLoad(url,name,navigate=true,cb=null){
  isPlaylistWorking=false;currentPlaylistExpiry='Bilinmiyor';isBuiltInMode=false;
  activeBuiltInCategory='TÜMÜ';localStorage.setItem('tkn_active_builtin_category','TÜMÜ');
  const playlistBadge=document.getElementById('badgePlaylistName');
  if(playlistBadge){playlistBadge.innerText=`M3U: ${name}`;playlistBadge.title=`M3U: ${name}`;}
  document.getElementById('badgeExpiryDate').innerText='Bitiş: Bağlanıyor...';
  updateHomeDashboard();
  if(/get\.php\?/i.test(url)||/player_api\.php\?/i.test(url)){
    let apiurl=url;
    if(/get\.php\?/i.test(url))apiurl=url.replace(/get\.php\?/i,'player_api.php?');
    currentBaseUrl=apiurl;
    fetchDataWithTimeout(apiurl,'json',15000).then(d=>{
      if(d&&d.user_info){
        isPlaylistWorking=true;
        const ed=d.user_info.exp_date;
        if(ed===null||ed===undefined||ed===''||Number(ed)===0)currentPlaylistExpiry='Sınırsız';
        else{const dt=new Date(Number(ed)*1000);currentPlaylistExpiry=Number.isNaN(dt.getTime())?'Bilinmiyor':dt.toLocaleDateString('tr-TR')}
        document.getElementById('badgeExpiryDate').innerText=`Bitiş: ${currentPlaylistExpiry}`;
        updateHomeDashboard();
      }else{isPlaylistWorking=false;currentPlaylistExpiry='Bilinmiyor';document.getElementById('badgeExpiryDate').innerText='Bitiş: Pasif/Hatalı';updateHomeDashboard()}
      if(navigate&&isPlaylistWorking)switchPage(activeTab==='live'?'livetv':activeTab==='vod'?'vod':'series');
      if(cb)cb();
    }).catch(()=>{isPlaylistWorking=false;currentPlaylistExpiry='Bilinmiyor';document.getElementById('badgeExpiryDate').innerText='Bitiş: Bağlantı Yok';updateHomeDashboard();if(cb)cb()});
  }else{
    if(/\.m3u(?:$|[?#])/i.test(url)){
      loadRemoteM3UPlaylist(url,name,navigate,cb);
      return;
    }
    currentBaseUrl=url;isPlaylistWorking=true;currentPlaylistExpiry='Bilinmiyor';
    document.getElementById('badgeExpiryDate').innerText='Bitiş: Bilinmiyor';updateHomeDashboard();
    if(navigate){
      const idx=savedPlaylists.findIndex(p=>p.url===url);
      if(idx>=0)localStorage.setItem('tkn_last_playlist_index',String(idx));
      setTimeout(()=>{try{loadBuiltInChannelsView()}catch(e){console.warn(e)}},150);
    }
    if(cb)cb();
  }
}

function loadCategoryCounts(cats,tab){
  const base=currentBaseUrl,key=`${base}|${tab}`;
  const apply=all=>{
    if(base!==currentBaseUrl||tab!==activeTab||!Array.isArray(all))return;
    const m=new Map();
    all.forEach(it=>{if(it.category_id!==undefined&&it.category_id!==null){const k=String(it.category_id);m.set(k,(m.get(k)||0)+1)}});
    document.querySelectorAll('#categoriesListContainer [data-category-count]').forEach(b=>{const k=String(b.dataset.categoryCount);if(m.has(k))b.textContent=m.get(k)});
  };
  if(tab==='vod'||tab==='series'){getAllContentForSearch(tab).then(apply);return}
  const cached=fullSearchCache[key];
  if(cached&&Date.now()-cached.time<5*60*1000){apply(cached.items);return}
  const parts=base.split('player_api.php?');if(parts.length<2)return;
  const p=new URLSearchParams(parts[1]);p.set('action','get_live_streams');p.delete('category_id');
  fetchDataWithTimeout(`${parts[0]}player_api.php?${p.toString()}`,'json',20000).then(all=>{
    if(!Array.isArray(all))return;
    fullSearchCache[key]={items:all,time:Date.now()};apply(all);
  }).catch(()=>{
    cats.forEach(cat=>{
      const b=document.querySelector(`#categoriesListContainer [data-category-count="${CSS.escape(String(cat.category_id))}"]`);
      const f=cat.count??cat.total_count??cat.stream_count??cat.streams_count;
      if(b&&Number.isFinite(Number(f)))b.textContent=Number(f);
    });
  });
}

  const {item,tab,num}=selectedMediaForDetails;
  closeMediaDetails();
  if(tab==='series'){openSeriesSeasons(item);return}
  checkAdultAndPlay(()=>playItem(item,num),item.name||item.title,item.category_name);
}

function playItem(it, num=1){
  let url=it.direct_source||it.stream_url||it.url||'',fb='';
  const title=it.name||it.title||'Oynatılıyor';
  if(!url){
    try{
      const api=new URL(currentBaseUrl);
      const un=api.searchParams.get('username'),pw=api.searchParams.get('password');
      const root=`${api.origin}${api.pathname.replace(/player_api\.php$/i,'').replace(/get\.php$/i,'')}`.replace(/\/+$/,'')+'/';
      if(un&&pw&&it.stream_id!==undefined){
        const u=encodeURIComponent(un),p=encodeURIComponent(pw);
        if(activeTab==='live'){const ext=String(it.container_extension||'m3u8').replace(/^\./,'');url=`${root}live/${u}/${p}/${it.stream_id}.${ext}`;fb=`${root}live/${u}/${p}/${it.stream_id}.${ext.toLowerCase()==='ts'?'m3u8':'ts'}`}
        else if(activeTab==='vod'){const ext=String(it.container_extension||'mp4').replace(/^\./,'');url=`${root}movie/${u}/${p}/${it.stream_id}.${ext}`;fb=`${root}movie/${u}/${p}/${it.stream_id}.${ext.toLowerCase()==='m3u8'?'mp4':'m3u8'}`}
      }
    }catch(e){console.warn('URL oluşturulamadı',e)}
  }
  if(url){
    if(activeTab==='vod')document.querySelector('.triple-column-layout')?.classList.add('player-visible');
    executeStreamPlay(url,title,fb, num, it.category_name||'Genel');
    if(activeTab==='vod')setTimeout(()=>enterLandscapeFullscreen(document.getElementById('videoPlayer')),120);
    if(activeTab==='live'){
      loadLiveEpg(it,title,num,it.category_name||'Genel');
      if(document.getElementById('contentPage')?.classList.contains('active')&&!document.fullscreenElement&&!document.webkitFullscreenElement)setTimeout(()=>focusRemoteElement(document.getElementById('playerContainer')),0);
    }
  }else{alert('Bu içerik için yayın bağlantısı bulunamadı.')}
}

function getPosterUrl(it){
  const info=it.info||{};
  const c=it.stream_icon||it.tvg_logo||it.channel_logo||it.logo||it.icon||it.cover||it.cover_big||it.movie_image||it.stream_icon_url||it.poster||it.poster_url||it.backdrop||info.movie_image||info.cover||info.cover_big||info.backdrop_path||'';
  if(!c)return;
  const v=String(c).trim();
  return v.startsWith('/')?`https://image.tmdb.org/t/p/w500${v}`:v;
}

function openSeriesSeasons(series){
  const parts=currentBaseUrl.split('player_api.php?');
  const layout=document.querySelector('.triple-column-layout');
  if(layout){layout.classList.remove('media-grid-mode','player-visible')}
  const c=document.getElementById('itemsListContainer');
  if(c)c.classList.remove('media-poster-grid');
  const titleEl=document.getElementById('itemsColumnTitle');
  if(parts.length<2){c.innerHTML='<div class="dash-card-desc">Dizi bilgisi yok</div>';return}
  const p=new URLSearchParams(parts[1]);p.set('action','get_series_info');p.set('series_id',series.series_id||series.id);
  window.currentSeriesTitle=series.name||series.title||'Dizi';
  window.currentSeriesEpisodes={};window.currentSeriesSeasons=[];window.currentSeriesItem=series;
  titleEl.innerHTML=`<button class="favorite-star" onclick="renderItems(itemsData);document.getElementById('itemsColumnTitle').textContent='Diziler'" title="Geri">‹</button> ${escapeHtml(window.currentSeriesTitle)}`;
  c.innerHTML='<div style="color:#cbd5e1;text-align:center;padding:18px">Sezonlar yükleniyor...</div>';
  fetch(`${parts[0]}player_api.php?${p.toString()}`).then(r=>r.json()).then(d=>{
    window.currentSeriesSeasons=Array.isArray(d.seasons)?d.seasons:[];
    window.currentSeriesEpisodes=d.episodes||{};
    if(!window.currentSeriesSeasons.length){c.innerHTML='<div style="color:#cbd5e1;text-align:center;padding:18px">Sezon yok</div>';return}
    const sk=s=>String(s.season_number??s.id);
    const sm=window.currentSeriesSeasons.map((s,i)=>{const k=sk(s);const lbl=s.name||`Sezon ${s.season_number??i+1}`;return`<button class="item-btn series-season-btn" data-season="${escapeHtml(k)}" onclick="selectInlineSeason('${escapeHtml(k)}')">${escapeHtml(lbl)}</button>`}).join('');
    c.innerHTML=`<div style="font-size:.7rem;color:#94a3b8;margin:2px 0">SEZONLAR</div><div id="seriesSeasonButtons" style="display:flex;flex-wrap:wrap;gap:4px;flex-shrink:0">${sm}</div><div style="font-size:.7rem;color:#94a3b8;margin:7px 0 2px">BÖLÜMLER</div><div id="seriesEpisodesList" style="display:flex;flex-direction:column;gap:4px;overflow-y:auto;min-height:0"></div>`;
    selectInlineSeason(sk(window.currentSeriesSeasons[0]));
  }).catch(()=>{c.innerHTML='<div style="color:#ef4444;text-align:center;padding:18px">Sezon bilgisi alınamadı</div>'});
}

function selectInlineSeason(key){
  document.querySelectorAll('.series-season-btn').forEach(b=>b.classList.toggle('active',b.dataset.season===String(key)));
  const c=document.getElementById('seriesEpisodesList');if(!c)return;
  const list=(window.currentSeriesEpisodes||{})[String(key)]||[];
  c.innerHTML='';
  if(!list.length){c.innerHTML='<div style="color:#94a3b8;text-align:center;padding:12px">Bu sezonda bölüm yok</div>';return}
  list.forEach((ep,i)=>{
    const n=ep.episode_num??i+1;const t=ep.title||ep.name||`Bölüm ${n}`;
    const b=document.createElement('button');b.className='item-btn';
    b.innerHTML=`<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(`Bölüm ${n} - ${t}`)}</span>`;
    b.onclick=()=>playSeriesEpisode(ep,n);
    c.appendChild(b);
  });
}

function playSeriesEpisode(ep,number){
  const parts=currentBaseUrl.split('player_api.php?');
  const base=parts[0];
  const cr=new URLSearchParams(parts[1]||'');
  const un=cr.get('username'),pw=cr.get('password');
  if(!un||!pw||!ep.id){alert('Bölüm bağlantısı oluşturulamadı');return}
  const ext=String(ep.container_extension||'mp4').replace(/^\./,'').trim()||'mp4';
  const url=`${base}series/${encodeURIComponent(un)}/${encodeURIComponent(pw)}/${encodeURIComponent(ep.id)}.${encodeURIComponent(ext)}`;
  const sel=window.currentSeriesSeasons?.find(x=>String(x.season_number??x.id)===String(document.querySelector('.series-season-btn.active')?.dataset.season));
  const season=sel?.name||`Sezon ${sel?.season_number||''}`;
  const t=ep.title||ep.name||`Bölüm ${number}`;
  document.querySelector('.triple-column-layout')?.classList.add('player-visible');
  executeStreamPlay(url,`${window.currentSeriesTitle} - ${season} - Bölüm ${number}: ${t}`, '', number, 'Dizi Bölümü');
  setTimeout(()=>enterLandscapeFullscreen(document.getElementById('videoPlayer')),120);
}

function setupMediaSearch(){
  const input=document.getElementById('mediaSearchInput');
  if(!input||input.dataset.ready==='1')return;
  input.dataset.ready='1';
  input.addEventListener('input',()=>{
    mediaSearchQuery=input.value.trim();
    clearTimeout(mediaSearchTimer);
    mediaSearchTimer=setTimeout(()=>applyMediaSearch(),180);
  });
}
function applyMediaSearch(){
  const input=document.getElementById('mediaSearchInput');
  if(!document.getElementById('contentPage')?.classList.contains('active'))return;
  if(activeTab==='live'){
    if(isBuiltInMode)filterBuiltInChannelsByCategory(activeBuiltInCategory);
    else renderItems(itemsData);
    return;
  }
  if(!(activeTab==='vod'||activeTab==='series'))return;
  const query=normalizeSearchText(mediaSearchQuery);
  if(!query){
    if(activeCategory!==null)loadItems(activeCategory);
    return;
  }
  const token=window.__mediaSearchToken=(window.__mediaSearchToken||0)+1;
  const c=document.getElementById('itemsListContainer');
  c.innerHTML='<div style="color:#64748b;font-size:.7rem;text-align:center;margin-top:2rem">Aranıyor...</div>';
  getAllContentForSearch(activeTab).then(all=>{
    if(token!==window.__mediaSearchToken)return;
    const found=(all||[]).filter(item=>normalizeSearchText(item.name||item.title).includes(query));
    itemsData=found;currentItemIndex=-1;renderItems(found);
  });
}

function showSearchKeyboard(targetId='mediaSearchInput'){
  activeSearchInputId=targetId||'mediaSearchInput';
  const panel=document.getElementById('searchKeyboard');
  if(!panel)return;
  panel.classList.add('visible');document.body.classList.add('search-keyboard-open');
  const currentQuery=document.getElementById(activeSearchInputId)?.value||'';
  if(activeSearchInputId==='homeSearch'&&currentQuery.trim())searchHomeContent(currentQuery);
  if(panel.dataset.ready==='1'){setTimeout(()=>focusRemoteElement(panel.querySelector('.search-key')),0);return}
  panel.dataset.ready='1';
  const rows=['qwertyuıopğü','asdfghjklşi','zxcvbnmöç'];
  panel.innerHTML='<div class="search-keyboard-title">Türkçe Arama Klavyesi</div>';
  rows.forEach(row=>{
    const line=document.createElement('div');line.className='search-keyboard-row';
    [...row].forEach(ch=>{
      const b=document.createElement('button');b.type='button';b.className='search-key';b.textContent=ch;b.setAttribute('aria-label',ch);
      b.onclick=()=>insertSearchText(ch);line.appendChild(b);
    });
    panel.appendChild(line);
  });
  const actions=document.createElement('div');actions.className='search-keyboard-row';
  [['⌫','Sil',()=>deleteSearchCharacter()],['Boşluk','Boşluk',()=>insertSearchText(' ')],['Temizle','Aramayı temizle',()=>clearSearchText()],['Ara / OK','Aramayı başlat',()=>submitHomeSearch()],['Exit','Klavyeyi kapat',()=>hideSearchKeyboard(false)]].forEach(([label,aria,fn])=>{
    const b=document.createElement('button');b.type='button';b.className='search-key search-key-wide';b.textContent=label;b.setAttribute('aria-label',aria);b.onclick=fn;actions.appendChild(b);
  });
  panel.appendChild(actions);
  setTimeout(()=>focusRemoteElement(panel.querySelector('.search-key')),0);
}
function clearHomeSearchResults(){const box=document.getElementById('homeSearchResults');if(box){box.classList.remove('search-horizontal');box.style.display='none';box.innerHTML=''}window.__focusSearchResultWhenReady=false;}
function updateHomeSearchDraft(){const input=document.getElementById('homeSearch');searchHomeContent(input?input.value:'');}
function insertSearchText(text){
  const input=document.getElementById(activeSearchInputId);if(!input)return;
  const start=input.selectionStart??input.value.length,end=input.selectionEnd??input.value.length;
  input.value=input.value.slice(0,start)+text+input.value.slice(end);
  const pos=start+text.length;try{input.setSelectionRange(pos,pos)}catch(e){}
  if(activeSearchInputId==='homeSearch')searchHomeContent(input.value);else applyMediaSearch();
}
function deleteSearchCharacter(){
  const input=document.getElementById(activeSearchInputId);if(!input)return;
  let start=input.selectionStart??input.value.length,end=input.selectionEnd??input.value.length;
  if(start===end&&start>0)start--;
  input.value=input.value.slice(0,start)+input.value.slice(end);
  try{input.setSelectionRange(start,start)}catch(e){}
  if(activeSearchInputId==='homeSearch')searchHomeContent(input.value);else applyMediaSearch();
}
function clearSearchText(){const input=document.getElementById(activeSearchInputId);if(input)input.value='';if(activeSearchInputId==='homeSearch')searchHomeContent('');else applyMediaSearch();}

function hideSearchKeyboard(focusResults=false){
  const panel=document.getElementById('searchKeyboard');if(panel)panel.classList.remove('visible');
  document.body.classList.remove('search-keyboard-open');
  const input=document.getElementById(activeSearchInputId);
  if(input&&activeSearchInputId==='homeSearch') {
    input.value = '';
    input.blur();
  }
  if(activeSearchInputId==='homeSearch')clearHomeSearchResults();
  if(focusResults&&activeSearchInputId==='homeSearch'){
    window.__focusSearchResultWhenReady=true;
    setTimeout(focusFirstSearchResult,100);
  }
}
function submitHomeSearch(){
  const input=document.getElementById(activeSearchInputId);const query=input?input.value.trim():'';
  if(!query){hideSearchKeyboard(false);return}
  if(activeSearchInputId==='homeSearch')searchHomeContent(query);else applyMediaSearch();hideSearchKeyboard(false);
}
function focusFirstSearchResult(){
  const first=document.querySelector('#homeSearchResults .search-result-card');
  if(first){window.__focusSearchResultWhenReady=false;focusRemoteElement(first);return true}
  return false;
}
function normalizeSearchText(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('tr-TR').replace(/[ıİ]/g,'i')}

function getAllContentForSearch(tab){
  const key=`${currentBaseUrl}|${tab}`;
  const c=fullSearchCache[key];
  if(c&&Date.now()-c.time<5*60*1000)return Promise.resolve(c.items);
  if(fullSearchPromises[key])return fullSearchPromises[key];
  const parts=currentBaseUrl.split('player_api.php?');
  if(parts.length<2)return Promise.resolve(itemsData||[]);
  const p=new URLSearchParams(parts[1]);
  p.set('action',tab==='live'?'get_live_streams':tab==='vod'?'get_vod_streams':'get_series');
  p.delete('category_id');
  const url=`${parts[0]}player_api.php?${p.toString()}`;
  fullSearchPromises[key]=fetchDataWithTimeout(url,'json',20000).then(d=>{
    const all=Array.isArray(d)?d:(itemsData||[]);
    fullSearchCache[key]={items:all,time:Date.now()};
    return all;
  }).catch(()=>itemsData||[]).finally(()=>{delete fullSearchPromises[key]});
  return fullSearchPromises[key];
}

function searchMovieSuggestions(query){
  const box=document.getElementById('homeSearchResults');
  if(!box)return;
  const q=String(query||'').trim();
  const token=++searchRenderToken;
  if(!q){box.className='home-panel home-results';box.style.display='none';box.innerHTML='';return;}
  box.className='home-panel home-results search-sections';box.style.display='flex';
  box.innerHTML='<div class="dash-card-desc">🎬 Film önerileri aranıyor...</div>';
  if(isBuiltInMode){
    const n=normalizeSearchText(q);
    const matches=builtInChannels.filter(c=>normalizeSearchText(c.name).includes(n)).slice(0,10);
    renderMovieSuggestions(box,matches,'live',token);
    return;
  }
  getAllContentForSearch('vod').then(items=>{
    if(token!==searchRenderToken)return;
    const n=normalizeSearchText(q);
    const matches=(items||[]).filter(item=>normalizeSearchText(item.name||item.title).includes(n)).slice(0,14);
    renderMovieSuggestions(box,matches,'vod',token);
  }).catch(()=>{
    if(token===searchRenderToken)box.innerHTML='<div class="dash-card-desc">Film listesi alınamadı. Bağlantıyı kontrol edin.</div>';
  });
}
function renderMovieSuggestions(box,matches,tab,token){
  if(token!==searchRenderToken)return;
  box.innerHTML='';
  if(!matches.length){box.innerHTML='<div class="dash-card-desc">Bu harflerle eşleşen film bulunamadı.</div>';return;}
  const section=document.createElement('section');section.className='search-result-section';
  const heading=document.createElement('div');heading.className='search-result-section-title';heading.textContent=`🎬 BENZER FİLMLER · ${matches.length}`;
  const row=document.createElement('div');row.className='search-result-row';
  matches.forEach((item,index)=>{
    const b=document.createElement('button');b.type='button';b.className='search-result-card';b.tabIndex=0;
    const img=getPosterUrl(item);
    b.innerHTML=`${img?`<img class="search-result-image" src="${escapeHtml(img)}" alt="" onerror="this.remove()">`:'<div class="search-result-image"></div>'}<span class="search-result-name">${escapeHtml(item.name||item.title||'İsimsiz')}</span>`;
    b.onclick=()=>openSearchResult(item,tab,index+1);
    row.appendChild(b);
  });
  section.appendChild(heading);section.appendChild(row);box.appendChild(section);
}

function searchHomeContent(query){
  const box=document.getElementById('homeSearchResults');
  const q=String(query||'').trim();
  if(!box)return;
  const token=++searchRenderToken;
  if(!q){box.className='home-panel home-results';box.style.display='none';box.innerHTML='';return}
  box.className='home-panel home-results search-sections';box.style.display='flex';
  const inContentPage=document.getElementById('contentPage')?.classList.contains('active');
  const scopedTab=inContentPage&&(activeTab==='vod'||activeTab==='series')?activeTab:null;
  const scopeLabel=scopedTab==='vod'?'filmler':scopedTab==='series'?'diziler':'canlı TV, filmler ve diziler';
  box.innerHTML=`<div class="dash-card-desc">${scopeLabel} aranıyor...</div>`;

  if(isBuiltInMode){
    const n=normalizeSearchText(q);
    const m=builtInChannels.filter(c=>normalizeSearchText(c.name).includes(n)).slice(0,40);
    if(!m.length){box.innerHTML='<div class="dash-card-desc">Eşleşme yok</div>';return}
    box.className='home-panel home-results search-horizontal';box.innerHTML='';
    m.forEach((item,index)=>{
      const b=document.createElement('button');b.className='search-result-card';
      const img=getPosterUrl(item);
      b.innerHTML=`${img?`<img class="search-result-image" src="${escapeHtml(img)}" alt="" onerror="this.remove()">`:'<div class="search-result-image"></div>'}<span class="search-result-name">#${index+1} ${escapeHtml(item.name||'')}</span>`;
      b.onclick=()=>{box.style.display='none';hideSearchKeyboard(false);loadBuiltInChannelsView();playBuiltInChannel(item,index+1)};
      box.appendChild(b);
    });
    if(window.__focusSearchResultWhenReady)focusFirstSearchResult();
    return;
  }

  const allTabs=[['live','📺 CANLI TV'],['vod','🎬 FİLMLER'],['series','📁 DİZİLER']];
  const tabs=scopedTab?allTabs.filter(([tab])=>tab===scopedTab):allTabs;
  Promise.all(tabs.map(async([tab,label])=>({tab,label,items:await getAllContentForSearch(tab)}))).then(groups=>{
    if(token!==searchRenderToken)return;
    const n=normalizeSearchText(q);let total=0;
    box.innerHTML='';
    groups.forEach(({tab,label,items})=>{
      const matches=(items||[]).filter(item=>normalizeSearchText(item.name||item.title).includes(n)).slice(0,12);
      if(!matches.length)return;
      total+=matches.length;
      const section=document.createElement('section');section.className='search-result-section';
      const heading=document.createElement('div');heading.className='search-result-section-title';heading.textContent=`${label} · ${matches.length} sonuç`;
      const row=document.createElement('div');row.className='search-result-row';
      matches.forEach((item,index)=>{
        const b=document.createElement('button');b.className='search-result-card';b.tabIndex=0;
        const img=getPosterUrl(item);
        b.innerHTML=`${img?`<img class="search-result-image" src="${escapeHtml(img)}" alt="" onerror="this.remove()">`:'<div class="search-result-image"></div>'}<span class="search-result-name">${escapeHtml(item.name||item.title||'İsimsiz')}</span>`;
        b.onclick=()=>openSearchResult(item,tab,index+1);
        row.appendChild(b);
      });
      section.appendChild(heading);section.appendChild(row);box.appendChild(section);
    });
    if(!total){box.innerHTML='<div class="dash-card-desc">Canlı TV, film ve dizilerde eşleşme bulunamadı.</div>';}
    if(window.__focusSearchResultWhenReady)focusFirstSearchResult();
  }).catch(()=>{if(token===searchRenderToken)box.innerHTML='<div class="dash-card-desc">Arama sırasında bağlantı hatası oluştu.</div>'});
}

function openSearchResult(item,tab, num=1){
  const box=document.getElementById('homeSearchResults');
  if(box){box.classList.remove('search-horizontal');box.style.display='none'}
  hideSearchKeyboard(false);
  const target=tab==='live'?'livetv':tab==='vod'?'vod':'series';
  const open=document.getElementById('contentPage').classList.contains('active');
  if(activeTab!==tab||!open)switchPage(target);
  if(tab==='series'||tab==='vod'){openMediaDetails(item,tab,num);return}
  playItem(item, num);
}

function remoteFocusableElements(root=document){
  if(root===document){const fs=document.fullscreenElement||document.webkitFullscreenElement;if(fs)root=fs}
  return Array.from(root.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])'))
    .filter(el=>{
      const s=getComputedStyle(el);
      return el.getClientRects().length>0 && s.visibility!=='hidden' && s.display!=='none' && parseFloat(s.opacity)>0;
    });
}
function warmPlaybackOrigin(el){
  if(!el||!el.closest||!el.closest('#itemsListContainer, #categoriesListContainer'))return;
  const target=el.dataset.streamUrl||el.dataset.channelUrl||currentBaseUrl;
  if(!target)return;
  try{
    const origin=new URL(target,location.href).origin;
    const alreadyWarm=Array.from(document.querySelectorAll('link[data-playback-origin]')).some(link=>link.dataset.playbackOrigin===origin);
    if(!/^https?:$/.test(new URL(origin).protocol)||alreadyWarm)return;
    const link=document.createElement('link');link.rel='preconnect';link.href=origin;link.crossOrigin='anonymous';link.dataset.playbackOrigin=origin;document.head.appendChild(link);
    const links=Array.from(document.querySelectorAll('link[data-playback-origin]'));
    while(links.length>3)links.shift().remove();
  }catch(e){}
}
function focusRemoteElement(el){
  if(!el)return false;
  warmPlaybackOrigin(el);
  try{
    el.focus({preventScroll:true});
    if(document.activeElement!==el && el.focus)el.focus();
    if(!(document.fullscreenElement||document.webkitFullscreenElement))el.scrollIntoView({block:'nearest',inline:'nearest'});
  }catch(e){}
  return true;
}

function moveRemoteFocus(dir){
  const modal=document.getElementById('customModal');
  const open=modal&&getComputedStyle(modal).display!=='none';
  const cur=document.activeElement;
  if(cur&&/^(INPUT|TEXTAREA|SELECT)$/.test(cur.tagName)&&cur.id!=='homeSearch')return;
  if(document.body.classList.contains('search-keyboard-open')&&cur&&cur.classList.contains('search-key')){
    if(dir==='up'&&cur.closest('.search-keyboard-row')===document.querySelector('#searchKeyboard .search-keyboard-row')){
      const firstResult=document.querySelector('#homeSearchResults .search-result-card');
      if(firstResult){focusRemoteElement(firstResult);return;}
    }
    moveSearchKeyboardFocus(dir,cur);return;
  }
  if(document.body.classList.contains('search-keyboard-open')&&cur&&cur.classList.contains('search-result-card')&&dir==='down'){
    const firstKey=document.querySelector('#searchKeyboard .search-key');if(firstKey){focusRemoteElement(firstKey);return;}
  }
  if(cur&&cur.id==='homeSearch'&&dir==='down'){
    const firstKey=document.querySelector('#searchKeyboard .search-key');
    if(firstKey){focusRemoteElement(firstKey);return}
  }
  const fullscreen=document.fullscreenElement||document.webkitFullscreenElement;
  const keyboardOpen=document.body.classList.contains('search-keyboard-open');
  const root=open?modal:(fullscreen||(keyboardOpen?document.getElementById('searchKeyboard'):document));
  const cands=remoteFocusableElements(root);
  if(!cands.length)return;
  if(!open&&!fullscreen&&cur&&cur.closest){
    const playlistGrid=cur.closest('#playlistsGridContainer');
    if(playlistGrid){
      const cards=remoteFocusableElements(playlistGrid);
      if(cards.includes(cur)){
        const a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;
        const candidates=cards.filter(el=>el!==cur).map(el=>{
          const r=el.getBoundingClientRect(),dx=r.left+r.width/2-ax,dy=r.top+r.height/2-ay;
          const forward=dir==='left'?-dx:dir==='right'?dx:dir==='up'?-dy:dy;
          const cross=(dir==='left'||dir==='right')?Math.abs(dy):Math.abs(dx);
          return {el,forward,cross};
        }).filter(x=>x.forward>2).sort((a,b)=>{
          const aAligned=a.cross<Math.max(35,dir==='left'||dir==='right'?a.el.getBoundingClientRect().height/2:a.el.getBoundingClientRect().width/2);
          const bAligned=b.cross<Math.max(35,dir==='left'||dir==='right'?b.el.getBoundingClientRect().height/2:b.el.getBoundingClientRect().width/2);
          return Number(bAligned)-Number(aAligned)||a.cross-b.cross||a.forward-b.forward;
        });
        if(candidates.length){focusRemoteElement(candidates[0].el);return;}
        // Kenar kartında yukarı/aşağı gezinirken sayfanın diğer kontrol alanlarına geç.
      }
    }
    const inCategories=cur.closest('#categoriesListContainer');
    const inItems=cur.closest('#itemsListContainer');
    if(inCategories&&dir==='right'){
      const first=document.querySelector('#itemsListContainer .channel-item, #itemsListContainer .item-btn, #itemsListContainer .media-poster-card');
      if(first){focusRemoteElement(first);return}
    }
    if(inItems&&dir==='left'){
      const active=document.querySelector('#categoriesListContainer .item-btn.active')||document.querySelector('#categoriesListContainer .item-btn');
      if(active){focusRemoteElement(active);return}
    }
    if(inCategories||inItems){
      const zone=inCategories?document.getElementById('categoriesListContainer'):document.getElementById('itemsListContainer');
      const local=remoteFocusableElements(zone);
      if(local.includes(cur)){
        const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
        const same=local.filter(el=>el!==cur).map(el=>{const q=el.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy,p=dir==='up'?-dy:dir==='down'?dy:dir==='left'?-dx:dx,cross=dir==='up'||dir==='down'?Math.abs(dx):Math.abs(dy);return{el,p,cross}}).filter(x=>x.p>1).sort((a,b)=>a.cross-b.cross||a.p-b.p);
        if(same.length){focusRemoteElement(same[0].el);return}
      }
    }
  }
  if(!cur||cur===document.body||!cands.includes(cur)){
    const active=cands.find(el=>el.classList.contains('active'))||cands[0];focusRemoteElement(active);return;
  }
  const rect=cur&&cur!==document.body?cur.getBoundingClientRect():null;
  if(!rect){focusRemoteElement(cands[0]);return}
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  const ranked=cands.filter(e=>e!==cur).map(e=>{
    const r=e.getBoundingClientRect();
    const dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy;
    const forward=dir==='left'?-dx:dir==='right'?dx:dir==='up'?-dy:dy;
    const cross=dir==='left'||dir==='right'?Math.abs(dy):Math.abs(dx);
    // Önce istenen yöndeki en yakın öğeye, hizası yakın olana öncelik ver.
    return{e,score:Math.abs(forward)+cross*2.5,p:forward};
  }).filter(x=>x.p>2).sort((a,b)=>a.score-b.score);
  if(ranked.length){focusRemoteElement(ranked[0].e);return}
  focusRemoteElement(cur);
}

function moveSearchKeyboardFocus(dir,current){
  const panel=document.getElementById('searchKeyboard');
  const rows=Array.from(panel?.querySelectorAll('.search-keyboard-row')||[]);
  const row=current.closest('.search-keyboard-row'),rowIndex=rows.indexOf(row);
  const keys=Array.from(row?.querySelectorAll('.search-key')||[]),index=keys.indexOf(current);
  if(index<0)return;
  if(dir==='left'||dir==='right'){
    const step=dir==='left'?-1:1;focusRemoteElement(keys[(index+step+keys.length)%keys.length]);return;
  }
  const nextRowIndex=rowIndex+(dir==='up'?-1:1);
  if(nextRowIndex<0){const input=document.getElementById('homeSearch');if(input)focusRemoteElement(input);return;}
  if(nextRowIndex>=rows.length)return;
  const rect=current.getBoundingClientRect(),x=rect.left+rect.width/2;
  const next=Array.from(rows[nextRowIndex].querySelectorAll('.search-key')).sort((a,b)=>{
    const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
    return Math.abs(ar.left+ar.width/2-x)-Math.abs(br.left+br.width/2-x);
  })[0];
  if(next)focusRemoteElement(next);
}

function setupRemoteControlListener(){
  let lastKeyCode=0,lastHandledAt=0;
  const dispatchRemoteKey=e=>{
    if(e.type==='keyup')return;
    const now=Date.now();
    const code=e.keyCode||e.which||0;
    const id=code||(e.key||'');
    if(e.type==='keyup'&&id===lastKeyCode&&now-lastHandledAt<350)return;
    if(e.type==='keydown'&&id===lastKeyCode&&now-lastHandledAt<120)return;
    lastKeyCode=id;
    lastHandledAt=now;
    handleKey(e);
  };
  window.addEventListener('keydown',dispatchRemoteKey,true);
  window.addEventListener('keyup',dispatchRemoteKey,true);

  document.body.setAttribute('tabindex','0');
  document.body.focus();
  document.addEventListener('click',e=>{
    const target=e.target&&e.target.closest&&e.target.closest('input,textarea,select,button,[contenteditable="true"],[role="button"]');
    if(target)return;
    try{document.body.focus()}catch(e){}
  },true);
}
function handleKey(e){
  const now=Date.now();

  const modal=document.getElementById('customModal');
  const open=modal&&getComputedStyle(modal).display!=='none';
  const act=document.activeElement;
  const editing=act&&(/^(INPUT|TEXTAREA|SELECT)$/.test(act.tagName)||act.isContentEditable);

  const k=e.key||'';
  const c=e.keyCode||e.which||0;

  if((k==='Home'||k==='TV_HOME'||c===3||c===172)&&!editing){
    e.preventDefault();e.stopPropagation();goHomeScreen();return;
  }
  if((k==='F11'||k==='f'||c===122)&&!editing){e.preventDefault();e.stopPropagation();toggleFullScreen();return}

  const keyName=String(k).toLowerCase().replace(/[ _-]/g,'');
  const isChUp=['channelup','mediachannelup','mediatracknext','mediatrackforward','ch+','channel+','channelnext','tvchannelup'].includes(keyName)||c===33||c===427||c===447||c===412||c===166||c===65376;
  const isChDown=['channeldown','mediachanneldown','mediatrackprevious','mediatrackprev','mediatrackback','ch-','channel-','channelprevious','tvchanneldown'].includes(keyName)||c===34||c===428||c===448||c===413||c===167||c===65377;
  if(!editing){
    if(isChUp){e.preventDefault();e.stopPropagation();changeChannelRelative(1);return}
    if(isChDown){e.preventDefault();e.stopPropagation();changeChannelRelative(-1);return}
  }

  const dirMap={'ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up','ArrowDown':'down','Left':'left','Right':'right','Up':'up','Down':'down','DPAD_LEFT':'left','DPAD_RIGHT':'right','DPAD_UP':'up','DPAD_DOWN':'down','KEY_LEFT':'left','KEY_RIGHT':'right','KEY_UP':'up','KEY_DOWN':'down'};
  const codeMap={37:'left',39:'right',38:'up',40:'down',21:'left',22:'right',19:'up',20:'down',65361:'left',65363:'right',65362:'up',65364:'down',100:'left',102:'right',101:'up',103:'down'};
  const dir=dirMap[k]||codeMap[c];
  const fullscreen=document.fullscreenElement||document.webkitFullscreenElement;
  const playerFocused=act&&act.id==='playerContainer';
  if(dir&&(isBuiltInMode||activeTab==='live')&&(fullscreen||playerFocused)&&!editing&&(dir==='up'||dir==='down')){
    e.preventDefault();e.stopPropagation();changeChannelRelative(dir==='up'?1:-1);return;
  }
  if(dir&&(!editing||(act&&act.id==='homeSearch'))){e.preventDefault();e.stopPropagation();moveRemoteFocus(dir);return}

  const isOk=k==='Enter'||k==='Select'||k==='Accept'||k===' '||c===13||c===23||c===66||c===32;
  if(isOk&&act&&act.id==='homeSearch'){
    e.preventDefault();e.stopPropagation();showSearchKeyboard();
    return;
  }
  if(isOk&&act&&act.id==='playerContainer'&&!open){e.preventDefault();e.stopPropagation();toggleFullScreen();return}
  if(isOk&&!editing){
    const t=act&&act!==document.body?act:remoteFocusableElements(open?modal:document)[0];
    if(t){
      e.preventDefault();e.stopPropagation();
      const isCh=!open&&(isBuiltInMode||activeTab==='live')&&!!t.closest('#itemsListContainer, .channel-item');
      if(isCh&&t===lastRemoteOkTarget&&now-lastRemoteOkAt<700){
        enterLandscapeFullscreen(document.getElementById('videoPlayer'));
        lastRemoteOkTarget=null;return;
      }
      lastRemoteOkTarget=t;lastRemoteOkAt=now;
      focusRemoteElement(t);
      try{t.click()}catch(err){}
    }
    return;
  }

  const isBack=c===27||c===8||c===4||c===166||c===461||c===10009||c===10072||c===10182||k==='Escape'||k==='Exit'||k==='EXIT'||k==='TV_EXIT'||k==='TVExit'||k==='Backspace'||k==='BrowserBack'||k==='GoBack'||k==='Go back'||k==='XF86Back'||k==='Back'||e.code==='BrowserBack';
  if(isBack){
    e.preventDefault();e.stopPropagation();
    if(open){closeModal(false);return}
    if(document.body.classList.contains('search-keyboard-open')){hideSearchKeyboard(false);return}
    const results=document.getElementById('homeSearchResults');if(results&&results.style.display!=='none'&&results.innerHTML){results.style.display='none';const search=document.getElementById('homeSearch');if(search)focusRemoteElement(search);return}
    goBackFromPlayer();
    return;
  }
}

  if(isBuiltInMode){
    const list=Array.isArray(window.currentBuiltInVisibleChannels)?window.currentBuiltInVisibleChannels:builtInChannels;

    const i=current<0?(dir>0?0:list.length-1):(current+dir+list.length)%list.length;
    window.currentPlayingBuiltInIndex=i;window.currentPlayingBuiltInUrl=list[i].url;
    checkAdultAndPlay(() => playBuiltInChannel(list[i], i+1), list[i].name, list[i].group);
    const fullscreen=document.fullscreenElement||document.webkitFullscreenElement;
    const zapFromPlayer=document.activeElement?.id==='playerContainer';
    const items=document.querySelectorAll('#itemsListContainer .channel-item');
    items.forEach((el,idx)=>{
      if(idx===i){el.classList.add('active');if(!fullscreen&&!zapFromPlayer)focusRemoteElement(el)}
      else el.classList.remove('active');
    });
  }else{
    if(!itemsData.length)return;
    if(currentItemIndex===-1)currentItemIndex=0;
    currentItemIndex+=dir;
    if(currentItemIndex<0)currentItemIndex=itemsData.length-1;
    if(currentItemIndex>=itemsData.length)currentItemIndex=0;
    const it = itemsData[currentItemIndex];
    checkAdultAndPlay(() => playItem(it, currentItemIndex + 1), it.name || it.title, it.category_name);
    const fullscreen=document.fullscreenElement||document.webkitFullscreenElement;
    const zapFromPlayer=document.activeElement?.id==='playerContainer';

    items.forEach((el,idx)=>{
      if(idx===currentItemIndex){el.classList.add('active');if(!fullscreen&&!zapFromPlayer)focusRemoteElement(el)}
      else el.classList.remove('active');
    });
  }
}

function isThemeAssetUrl(value){
  const raw=String(value||'').trim();if(!raw)return false;
  try{
    const u=new URL(raw,location.href);let path=u.pathname,host=u.hostname.toLowerCase();
    try{path=decodeURIComponent(path)}catch(e){}
    // Google thumbnails (including encrypted-tbn*.gstatic.com) have no image suffix.
    const imageHosts=/(?:^|\.)(?:gstatic\.com|googleusercontent\.com|images\.unsplash\.com|images\.pexels\.com|cdn\.pixabay\.com)$/i;
    return imageHosts.test(host)||/(?:^|\/)images?(?:\/|$)/i.test(path)||/\.(?:png|jpe?g|gif|webp|avif|bmp|svg)(?:$|\/)/i.test(path)||/(?:^|\/)(?:themes?|wallpapers?|backgrounds?)(?:\/|$)/i.test(path)||/(?:^|[?&])q=tbn:/i.test(u.search);
  }catch(e){return /\.(?:png|jpe?g|gif|webp|avif|bmp|svg)(?:$|[?#])/i.test(raw)||/gstatic\.com|googleusercontent\.com/i.test(raw)}
}
function normalizeCloudTheme(t){
  if(typeof t==='string')return /^https?:\/\//i.test(t.trim())?{name:'Tema',url:t.trim()}:null;
  if(!t||typeof t!=='object')return null;
  const url=t.url??t.imageUrl??t.image_url??t.backgroundUrl??t.background_url??t.image??t.background??t.src??t.themeUrl??t.theme_url;
  return url&&/^https?:\/\//i.test(String(url).trim())?{name:t.name||t.title||'Tema',url:String(url).trim()}:null;
}
function normalizeCloudChannel(c, fallbackGroup='BULUTTAN EKLENEN'){
  if(!c || typeof c!=='object') return null;
  const name=c.name??c.title??c.channelName??c.channel_name??c.kanalAdi??c.kanal_adi??c.label??c.channel??c.kanal??c['tvg-name']??c.tvgName;
  const url=c.url??c.streamUrl??c.stream_url??c.channelUrl??c.channel_url??c.link??c.src??c.address??c.adres??c.m3u8??c.stream??c.playUrl??c.play_url;
  if(!name || !url) return null;
  const cleanUrl=String(url).trim();
  if(!/^https?:\/\//i.test(cleanUrl)||isThemeAssetUrl(cleanUrl)) return null;
  return {
    name:String(name).trim(),
    url:cleanUrl,
    logo:String(c.logo??c.tvgLogo??c.tvg_logo??c.icon??c.image??c['tvg-logo']??''),
    group:String(c.group??c.category??c.groupTitle??c.group_title??c.categoryName??c.category_name??c.group_name??c.kategori??c.grup??fallbackGroup)
  };
}

function findCloudChannelRecords(data,excludedThemeUrls=new Set()){
  if(!data||typeof data!=='object')return [];
  // Panel sürümleri farklı alan adları kullanabildiği için bilinen kanal
  // alanlarını ve bunların items/data/records/list alt koleksiyonlarını tara.
  // playlists ve themes kanal değildir; özellikle playlists alanını tarama.
  const channelKeys=['builtIns','installedChannels','uploadedChannels','uploaded_channels','channels','userChannels','user_channels','channelList','channel_list','channelItems','channel_items'];
  const unique=new Map();
  const visit=(value,depth=0)=>{
    if(!value||depth>5)return;
    if(Array.isArray(value)){value.forEach(item=>visit(item,depth+1));return}
    if(typeof value!=='object')return;
    const direct=normalizeCloudChannel(value);
    if(direct&&!excludedThemeUrls.has(direct.url.toLowerCase()))unique.set(direct.url.toLowerCase(),direct);
    channelKeys.forEach(key=>{if(Object.prototype.hasOwnProperty.call(value,key))visit(value[key],depth+1)});
    if(value.channel)visit(value.channel,depth+1);
  };
  channelKeys.forEach(key=>{if(Object.prototype.hasOwnProperty.call(data,key))visit(data[key],0)});
  return Array.from(unique.values());
}

async function loadFromFirebaseCloud(isSilent = false){
  try{
    const db=await ensureTknFirebase();

    const themeSources=[data.themes,data.theme,data.customThemes,data.custom_themes,data.themeUrl,data.theme_url,data.backgroundUrl,data.background_url].filter(Boolean);

    const invalidCloudChannelCount=Math.max(0,rawCloudChannelCount-cloudChannels.length);

    let added=0,skipped=0;

    usableCloudPlaylists.forEach(item=>{
      const url=String(item.url).trim();
      const exists=savedPlaylists.find(p=>String(p.url||'').trim()===url);
      if(!exists){savedPlaylists.push({name:item.name||'Bulut Listesi',url,expiry:item.expiry||'Yükleniyor...',status:'Kontrol ediliyor'});added++}
      else{if(item.name)exists.name=item.name;if(item.expiry)exists.expiry=item.expiry;skipped++}
    });
    if(isSilent&&usableCloudPlaylists.length){
      const newestUrl=String(usableCloudPlaylists[usableCloudPlaylists.length-1].url).trim();
      const newestIndex=savedPlaylists.findIndex(item=>String(item.url||'').trim()===newestUrl);
      if(newestIndex>=0)localStorage.setItem('tkn_last_playlist_index',String(newestIndex));

      if(!Array.isArray(localThemes))localThemes=[];
      const mergedThemes=[];const seenThemeUrls=new Set();
      // Keep previously saved local themes and add every cloud theme, not just the last one.
      [...localThemes,...usableCloudThemes].forEach(theme=>{
        const normalized=normalizeCloudTheme(theme);if(!normalized)return;
        const key=normalized.url.trim().toLowerCase();if(seenThemeUrls.has(key))return;

      });

      // Bulutta bulunan bir kanal yeniden yayımlandıysa eski cihaz silme işareti

      const currentCloudUrlKeys=new Set(normalized.map(c=>String(c.url||'').trim().toLowerCase()));
      const deletedNow=getDeletedBuiltInChannelUrls();
      for(const oldUrl of Array.from(deletedNow)){
        if(currentCloudUrlKeys.has(String(oldUrl||'').trim().toLowerCase()))deletedNow.delete(oldUrl);
      }
      localStorage.setItem('tkn_deleted_builtin_channels',JSON.stringify([...deletedNow]));

        try{localStorage.setItem('tkn_user_added_builtin_channels',JSON.stringify(storedChannels));}

      }

      if(isBuiltInMode){renderBuiltInCategories(builtInCategories);filterBuiltInChannelsByCategory(activeBuiltInCategory);}
    }

    try{refreshContentAfterCloud()}catch(refreshError){console.error('Bulut içeriği yenileme hatası:',refreshError)}
    if(!isSilent){
      alert(`✅ BULUT YÜKLENDİ\n\n`+
        `📺 M3U listeleri: ${cloudPlaylists.length}\n`+
        `   • ${added} yeni eklendi${skipped?`, ${skipped} zaten vardı`:''}\n\n`+
        `🎨 Temalar: ${cloudThemes.length}\n`+
        `   • ${addedThemes} yeni eklendi\n\n`+
        `📡 Bulutta bulunan yüklü kanallar: ${cloudChannels.length}\n`+
        `   • Ham kayıt: ${rawCloudChannelCount}\n`+
        `   • Geçersiz/yayın URL'si olmayan kayıt: ${invalidCloudChannelCount}\n`+
        `   • ${addedCloudChannels} yeni kanal eklendi / mevcut bulut kanalları güncellendi\n`+
        `   • Silinmiş kanallar geri yüklenmedi\n`+
        `   • Yerelde kayıtlı yüklü kanallar: ${builtInChannels.length}\n`);
    }
  }catch(e){
    console.error('Firebase hatası:',e);
    if(!isSilent) alert("❌ Bulut hatası:\n\n"+(e.message||e));
  }
}
window.loadFromFirebaseCloud=loadFromFirebaseCloud;
</script>
</body>
</html>
